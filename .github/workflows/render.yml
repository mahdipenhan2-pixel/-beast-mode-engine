name: BEAST MODE - Render Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Inspect input files
        run: |
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Repository files:"
          ls -la
          echo "Studio files:"
          find studio -maxdepth 3 -type f -print
          echo "Audio directory:"
          ls -la studio/audio

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check Python
        run: python3 --version

      - name: Render final video
        run: python3 studio/render.py

      - name: Upload final MP4
        uses: actions/upload-artifact@v7
        with:
          name: BEAST-MODE-FINAL
          path: studio/output/BEAST-MODE-FINAL.mp4
          if-no-files-found: error
          retention-days: 7
